<!-- restore the beacon state before first paint so the grid never flashes -->
<script>try{if(localStorage.getItem('ashuzaifa.sig')==='off')document.documentElement.classList.add('sig-off')}catch(e){}</script>
</head>

<body>

<div class="grid-overlay" aria-hidden="true"></div>

<header class="hdr" id="hdr">
  <a class="mark" href="index.html">
    <span class="mark__name">AsHuzaifa</span>
    <span class="mark__desc">Minor Works &amp; Field Notes</span>
  </a>

  <nav class="nav">
    <a href="index.html#about">about</a>
    <a href="index.html#index">index</a>
    <a href="index.html#contact">contact</a>

    <button class="beacon" id="beacon" type="button" aria-pressed="true" title="Toggle the wireframe grid">
      <svg viewBox="0 0 14 14" aria-hidden="true">
        <circle class="core" cx="2" cy="12" r="1.6"/>
        <path class="arc" d="M2 8.2A3.8 3.8 0 0 1 5.8 12"/>
        <path class="arc" d="M2 5A7 7 0 0 1 9 12"/>
        <path class="arc" d="M2 1.8A10.2 10.2 0 0 1 12.2 12"/>
      </svg>
      <span class="beacon__label">sig&nbsp;/&nbsp;</span>
    </button>
  </nav>
</header>

<main id="project-root"></main>

<div class="readout" id="readout" aria-hidden="true">
  <span id="readout-sec">project</span>
  <span class="readout__bar"><i id="readout-bar"></i></span>
  <span id="readout-pct">000%</span>
</div>
